<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ADMIN LOGIN</h1>
        <div class="nav"><a href="index.html">Back to Home</a></div>
    </header>

    <div class="form-container">
        <h2 style="color: #ff4500; text-align: center;">ENTER PASSWORD</h2>
        <form id="loginForm">
            <div class="form-group">
                <input type="password" id="adminPassword" required placeholder="Password yahan daalein">
            </div>
            <p id="errorMsg" style="color: #ff4500; display: none; text-align: center; margin-bottom: 10px;">Galat Password!</p>
            <button type="submit" class="btn">Login Securely</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
